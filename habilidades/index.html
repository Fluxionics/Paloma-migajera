<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habilidades — Paloma Migajera</title>
  <link rel="stylesheet" href="../shared/global.css">
  <style>
    body { overflow-y: auto; overflow-x: hidden; }

    .hab-layout {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ---- Header ---- */
    .hab-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    .hab-title {
      font-family: var(--font-title);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--text-hi);
    }
    .hab-sub {
      font-style: italic;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    /* ---- Tabs ---- */
    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      font-family: var(--font-title);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ---- Tab content ---- */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeUp 0.3s var(--ease) forwards; }

    /* ---- Habilidades de movimiento ---- */
    .mov-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .mov-card {
      padding: 20px;
      background: rgba(21,21,31,0.7);
      border: 1px solid var(--border);
      border-top: 2px solid var(--border);
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .mov-card.unlocked { border-top-color: var(--accent); }
    .mov-card.locked   { opacity: 0.5; filter: grayscale(0.5); }
    .mov-card:hover.unlocked { background: rgba(232,200,96,0.04); }

    .mov-card-icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 10px;
    }
    .mov-card-name {
      font-family: var(--font-title);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-hi);
      margin-bottom: 6px;
    }
    .mov-card-tech {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--accent2);
      margin-bottom: 8px;
    }
    .mov-card-desc {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.5;
    }
    .mov-card-unlock {
      margin-top: 10px;
      font-family: var(--font-title);
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: var(--muted);
    }
    .mov-card-unlock.done { color: var(--success); }

    .lock-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      font-size: 1.5rem;
      pointer-events: none;
    }

    /* ---- Habilidades activas ---- */
    .active-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .active-card {
      padding: 20px 22px;
      background: rgba(21,21,31,0.7);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent2);
    }

    .active-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .active-icon { font-size: 1.6rem; }
    .active-name {
      font-family: var(--font-title);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--text-hi);
    }
    .active-cost {
      margin-left: auto;
      font-family: var(--font-title);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      background: rgba(232,200,96,0.1);
      border: 1px solid rgba(232,200,96,0.3);
      padding: 3px 8px;
    }
    .active-desc {
      font-size: 0.87rem;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.6;
    }

    /* ---- Amuletos (Plumas de Poder) ---- */
    .amuleto-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 24px;
    }

    .amuleto-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .amuleto-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(21,21,31,0.6);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .amuleto-item:hover { border-color: var(--accent); background: rgba(232,200,96,0.04); }
    .amuleto-item.equipped {
      border-color: var(--accent);
      background: rgba(232,200,96,0.06);
    }
    .amuleto-item.equipped::after {
      content: 'EQUIPADO';
      position: absolute;
      right: 16px;
      font-family: var(--font-title);
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: var(--accent);
    }

    .amuleto-icon { font-size: 1.4rem; width: 32px; text-align: center; }
    .amuleto-info { flex: 1; }
    .amuleto-name {
      font-family: var(--font-title);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--text-hi);
      margin-bottom: 2px;
    }
    .amuleto-desc { font-size: 0.82rem; color: var(--text-dim); font-style: italic; }

    /* Ranuras de amuletos equipados */
    .equipped-panel {
      background: rgba(21,21,31,0.7);
      border: 1px solid var(--border);
      padding: 20px;
    }
    .equipped-title {
      font-family: var(--font-title);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .amuleto-slot {
      aspect-ratio: 1;
      border: 1px dashed var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      background: rgba(0,0,0,0.2);
      transition: all 0.2s;
    }
    .amuleto-slot.filled {
      border-style: solid;
      border-color: var(--accent);
      background: rgba(232,200,96,0.06);
    }
    .slots-count {
      font-family: var(--font-title);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="bg-layer">
    <div class="bg-gradient"></div>
    <div class="bg-grain"></div>
  </div>
  <canvas id="particles" class="particles-canvas"></canvas>

  <div class="page">
    <div class="hab-layout">

      <div class="hab-header fade-up">
        <div>
          <div class="hab-title">Habilidades</div>
          <div class="hab-sub">Maniobras de vuelo, cantos del viento y plumas de poder.</div>
        </div>
        <button class="btn" onclick="goTo('../menu/index.html')">← Menú</button>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('movimiento', this)"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" style="vertical-align:-2px;margin-right:6px;"><path d="M8 1l3 4H5zM8 6l3 4H5z" opacity="0.9"/></svg>Movimiento</button>
        <button class="tab-btn" onclick="showTab('activas', this)"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" style="vertical-align:-2px;margin-right:6px;color:#e8c840;"><polygon points="9,1 5,8 8,8 7,15 11,8 8,8"/></svg>Activas</button>
        <button class="tab-btn" onclick="showTab('amuletos', this)"><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" style="vertical-align:-2px;margin-right:6px;"><path d="M12 1c-2 2-4 5-5 8-1 3-2 5-3 6 1-2 3-4 5-5 2-1 4-2 6-5z" opacity="0.9"/></svg>Plumas de Poder</button>
      </div>

      <!-- MOVIMIENTO -->
      <div class="tab-panel active" id="tab-movimiento">
        <div class="mov-grid" id="mov-grid"></div>
      </div>

      <!-- ACTIVAS -->
      <div class="tab-panel" id="tab-activas">
        <div class="active-grid" id="active-grid"></div>
      </div>

      <!-- AMULETOS -->
      <div class="tab-panel" id="tab-amuletos">
        <div class="amuleto-layout">
          <div class="amuleto-list" id="amuleto-list"></div>
          <div>
            <div class="equipped-panel">
              <div class="equipped-title">— Plumas Equipadas —</div>
              <div class="slot-grid" id="slot-grid"></div>
              <div class="slots-count" id="slots-count">0 / 3 ranuras</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="../shared/utils.js"></script>
  <script>
    let save = getSave();

    // ---- Datos de habilidades ----
    const SVG_DOUBLE = '<img src="../Doble Salto.gif" alt="Doble Salto" style="width:30px;height:30px;image-rendering:pixelated;object-fit:contain;">';
    const SVG_DASH   = '<svg viewBox="0 0 16 16" width="30" height="30" fill="currentColor" style="color:#6ab0d8;"><path d="M2 8h10l-3-3 1-1 4 4-4 4-1-1 3-3H2z" opacity="0.8"/></svg>';
    const SVG_POUND  = '<svg viewBox="0 0 16 16" width="30" height="30" fill="currentColor" style="color:#c06030;"><path d="M8 1v10M4 11h8l-4 4z" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8" y1="5" x2="8" y2="9" stroke="#c06030" stroke-width="2"/></svg>';
    const SVG_GLIDE  = '<svg viewBox="0 0 16 16" width="30" height="30" fill="currentColor" style="color:#30a0a0;"><path d="M3 8h10M6 12l2-2h4zM2 12l2-2h4z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';

    const MOVIMIENTO = [
      {
        id: 'dobleSalto', icon: SVG_DOUBLE, name: 'Ascenso Térmico',
        tech: 'double_jump',
        desc: 'Aprovecha una corriente de aire para elevarte una segunda vez en el aire.',
        unlock: 'Tras derrotar al Cuervo de la Chimenea.',
      },
      {
        id: 'dash', icon: SVG_DASH, name: 'Impulso de Pluma',
        tech: 'dash_air',
        desc: 'Un rápido desplazamiento lateral. Invencible durante el dash.',
        unlock: 'Encontrado en el Nido del Halcón.',
      },
      {
        id: 'picado', icon: SVG_POUND, name: 'Picado Balístico',
        tech: 'ground_pound',
        desc: 'Cae a gran velocidad. Destruye maderas podridas y aturde enemigos.',
        unlock: 'Alcantarillas de Migas.',
      },
      {
        id: 'planeo', icon: SVG_GLIDE, name: 'Planeo Silencioso',
        tech: 'glide_mode',
        desc: 'Mantén ESPACIO en el aire para descender lentamente y en silencio.',
        unlock: 'Regalo de la Lechuza Sabia.',
      },
    ];

    const SVG_SOUND  = '<svg viewBox="0 0 16 16" width="24" height="24" fill="currentColor" style="color:#e8c840;"><path d="M2 5h3l4-3v12l-4-3H2z" opacity="0.8"/><path d="M11 5c1 1 1 5 0 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
    const SVG_SHIELD = '<svg viewBox="0 0 16 16" width="24" height="24" fill="currentColor" style="color:#30a0a0;"><path d="M8 1L2 4v4c0 3.5 2.7 6.8 6 8 3.3-1.2 6-4.5 6-8V4z" opacity="0.8"/></svg>';
    const SVG_PALOU  = '<svg viewBox="0 0 16 16" width="24" height="24" style="color:#6ab0d8;"><circle cx="8" cy="8" r="5" fill="#6ab0d8" opacity="0.6"/><circle cx="8" cy="8" r="3" fill="#c0e8ff"/><circle cx="8" cy="8" r="1.5" fill="#fff"/></svg>';
    const SVG_RAY    = '<svg viewBox="0 0 16 16" width="24" height="24" fill="currentColor" style="color:#ffe060;"><polygon points="9,1 5,8 8,8 7,15 11,8 8,8"/></svg>';

    const ACTIVAS = [
      {
        icon: SVG_SOUND, name: 'Arpegio de Choque', cost: '15 Energía',
        desc: 'Lanza una onda sonora que aturde a enemigos pequeños y activa interruptores lejanos.',
      },
      {
        icon: SVG_SHIELD, name: 'Escudo de Plumón', cost: '25 Energía',
        desc: 'Crea un torbellino de plumas que bloquea proyectiles durante 2 segundos.',
      },
      {
        icon: SVG_PALOU, name: 'PALOMADUKEN', cost: '20 Energía',
        desc: 'Concentra energía en un proyectil devastador de migas comprimidas. Pulsa [X].',
      },
      {
        icon: SVG_RAY, name: 'Rayo de Migaja', cost: '40 Energía',
        desc: 'Picotazo frontal devastador que atraviesa armaduras y múltiples enemigos.',
      },
    ];

    const SVG_LEAD = '<svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" style="color:#9090a0;"><circle cx="8" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    const SVG_MAGNET = '<svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" style="color:#c03030;"><path d="M1 1h6l-1 6 2 2 2-2-1-6h6v6C15 11 12 15 8 15S1 11 1 7z" opacity="0.85"/></svg>';
    const SVG_HEART = '<svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" style="color:#c03030;"><path d="M8 14s-5.5-3.5-7-6.5C.5 5 .5 3 2 2s3 .5 4 2c1-1.5 3-2 4-2s3.5 1 3.5 3.5S9.5 10.5 8 14z"/></svg>';
    const SVG_CITY = '<svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" style="color:#80a0c0;"><rect x="1" y="8" width="4" height="7" opacity="0.8"/><rect x="5" y="5" width="4" height="10" opacity="0.8"/><rect x="9" y="2" width="4" height="13" opacity="0.8"/><rect x="13" y="7" width="2" height="8" opacity="0.8"/></svg>';
    const SVG_SHADE = '<svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" style="color:#6060a0;"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3v5l4 3" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>';
    const SVG_FAST = '<svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" style="color:#e8c840;"><polygon points="9,1 5,8 8,8 7,15 11,8 8,8"/></svg>';

    const AMULETOS = [
      { id:'plomo',   icon:SVG_LEAD,   name:'Pluma de Plomo',    desc:'Caes más rápido, inmune al empuje del viento fuerte.' },
      { id:'iman',    icon:SVG_MAGNET, name:'Miga Imán',         desc:'Atraes automáticamente las migajas cercanas.' },
      { id:'gorrion', icon:SVG_HEART,  name:'Corazón de Gorrión',desc:'+1 de vida máxima, pero reduce tu velocidad de planeo.' },
      { id:'ciudad',  icon:SVG_CITY,   name:'Canto de Ciudad',   desc:'Los NPCs humanos te tiran más migajas de lo normal.' },
      { id:'sombra',  icon:SVG_SHADE,  name:'Pluma Sombría',     desc:'Invisibilidad breve al hacer dash en la oscuridad.' },
      { id:'veloz',   icon:SVG_FAST,   name:'Pluma Veloz',       desc:'Incrementa la velocidad de movimiento en un 20%.' },
    ];

    // ---- Render Movimiento ----
    function renderMovimiento() {
      const grid = document.getElementById('mov-grid');
      grid.innerHTML = MOVIMIENTO.map(h => {
        const unlocked = save.habilidades[h.id];
        return `
          <div class="mov-card ${unlocked ? 'unlocked' : 'locked'}">
            <span class="mov-card-icon" style="display:flex;color:${unlocked ? '#e8c840' : '#606080'};">${h.icon}</span>
            <div class="mov-card-name">${h.name}</div>
            <div class="mov-card-tech">${h.tech}</div>
            <div class="mov-card-desc">${h.desc}</div>
            <div class="mov-card-unlock ${unlocked ? 'done' : ''}">
              ${unlocked
                ? '<svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" style="vertical-align:-2px;margin-right:4px;color:#40b860;"><path d="M3 8l4 4 6-8" fill="none" stroke="#40b860" stroke-width="2"/></svg>DESBLOQUEADA'
                : '<svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" style="vertical-align:-2px;margin-right:4px;"><rect x="3" y="7" width="10" height="8" rx="1" opacity="0.8"/><path d="M5 7V5a3 3 0 016 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>' + h.unlock}
            </div>
            ${!unlocked ? '<div class="lock-overlay"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" style="color:#a0a0c0;"><rect x="3" y="7" width="10" height="8" rx="1" opacity="0.8"/><path d="M5 7V5a3 3 0 016 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div>' : ''}
          </div>
        `;
      }).join('');
    }

    // ---- Render Activas ----
    function renderActivas() {
      const grid = document.getElementById('active-grid');
      grid.innerHTML = ACTIVAS.map(a => `
        <div class="active-card">
          <div class="active-header">
            <span class="active-icon" style="display:flex;">${a.icon}</span>
            <span class="active-name">${a.name}</span>
            <span class="active-cost">${a.cost}</span>
          </div>
          <div class="active-desc">${a.desc}</div>
        </div>
      `).join('');
    }

    // ---- Render Amuletos ----
    function renderAmuletos() {
      const list = document.getElementById('amuleto-list');
      list.innerHTML = AMULETOS.map(a => {
        const eq = save.amuletosEquipados.includes(a.id);
        return `
          <div class="amuleto-item ${eq ? 'equipped' : ''}" onclick="toggleAmuleto('${a.id}')">
            <span class="amuleto-icon" style="display:flex;${eq ? 'color:#e8c840;' : 'color:#9090b0;'}">${a.icon}</span>
            <div class="amuleto-info">
              <div class="amuleto-name">${a.name}</div>
              <div class="amuleto-desc">${a.desc}</div>
            </div>
          </div>
        `;
      }).join('');
      renderSlots();
    }

    function renderSlots() {
      const grid = document.getElementById('slot-grid');
      const slots = [];
      for (let i = 0; i < 3; i++) {
        const id = save.amuletosEquipados[i];
        const am = id ? AMULETOS.find(a => a.id === id) : null;
        slots.push(`
          <div class="amuleto-slot ${am ? 'filled' : ''}" style="display:flex;align-items:center;justify-content:center;">
            ${am ? am.icon : ''}
          </div>
        `);
      }
      grid.innerHTML = slots.join('');
      document.getElementById('slots-count').textContent =
        `${save.amuletosEquipados.length} / 3 ranuras usadas`;
    }

    function toggleAmuleto(id) {
      const idx = save.amuletosEquipados.indexOf(id);
      if (idx >= 0) {
        save.amuletosEquipados.splice(idx, 1);
        toast('Pluma desequipada', 'info');
      } else {
        if (save.amuletosEquipados.length >= 3) {
          toast('Máximo 3 plumas equipadas', 'bad');
          return;
        }
        save.amuletosEquipados.push(id);
        toast('Pluma equipada', 'ok');
      }
      setSave(save);
      renderAmuletos();
    }

    // ---- Tabs ----
    function showTab(id, btn) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      btn.classList.add('active');
    }

    // ---- Dev: desbloquear todo para pruebas ----
    function unlockAll() {
      for (const k in save.habilidades) save.habilidades[k] = true;
      setSave(save);
      renderMovimiento();
      toast('Todas las habilidades desbloqueadas', 'ok');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMovimiento();
      renderActivas();
      renderAmuletos();
    });
  </script>
</body>
</html>
