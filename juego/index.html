<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paloma Migajera</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:#e8c840; --blood:#c03030; --sky:#6ab0d8;
      --panel:rgba(12,12,22,0.92); --border:#252535;
      --text:#b0b0d0; --text-hi:#e8e8ff; --muted:#3a3a55;
      --font-title:'Cinzel',serif; --font-body:'IM Fell English',serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#000;overflow:hidden;font-family:var(--font-body);color:var(--text);}

    #game-canvas{display:block;position:fixed;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges;}

    /* HUD */
    #hud{position:fixed;top:0;left:0;right:0;z-index:40;padding:14px 18px;background:linear-gradient(180deg,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.35) 60%,transparent 100%);pointer-events:none;display:flex;align-items:flex-start;gap:16px;}
    .hud-left,.hud-right{background:linear-gradient(180deg,rgba(10,10,22,0.7),rgba(10,10,22,0.25));border:1px solid rgba(255,255,255,0.07);border-bottom-color:rgba(232,200,64,0.18);border-radius:10px;padding:9px 12px;backdrop-filter:blur(2px);}
    .hud-left{display:flex;flex-direction:column;gap:7px;min-width:180px;}
    .hud-hearts{display:flex;gap:4px;flex-wrap:wrap;max-width:132px;}
    .heart{width:16px;height:15px;background:linear-gradient(180deg,#ff8a7a 0%,#e0524c 45%,#b02430 100%);clip-path:polygon(50% 0%,100% 28%,100% 68%,50% 100%,0% 68%,0% 28%);filter:drop-shadow(0 0 3px rgba(224,82,76,0.55));transition:transform 0.2s,background 0.2s;flex-shrink:0;}
    .heart.empty{background:#221018;filter:none;transform:scale(0.92);}
    .hud-bar-row{display:flex;align-items:center;gap:7px;}
    .hud-bar-lbl{font-family:var(--font-title);font-size:0.5rem;letter-spacing:0.12em;color:var(--muted);width:14px;text-align:right;}
    .hud-bar-track{width:112px;height:6px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.12);border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);}
    .hud-bar-fill{height:100%;border-radius:2px;position:relative;transition:width 0.3s ease;overflow:hidden;}
    .hud-bar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.4),rgba(255,255,255,0.06) 40%,transparent 55%);}
    .mp-fill{background:linear-gradient(90deg,#185888,#30a0d8,#6ac0e8);}
    .energy-fill{background:linear-gradient(90deg,#886010,var(--gold),#ffe880);}

    .hud-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--font-title);}
    .hud-zona{font-size:0.55rem;letter-spacing:0.22em;color:var(--muted);text-transform:uppercase;text-shadow:0 0 12px rgba(232,200,64,0.15);}
    .hud-migajas{font-size:0.8rem;letter-spacing:0.1em;color:var(--gold);text-shadow:0 0 10px rgba(232,200,64,0.35);}

    .hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
    .hud-abilities{display:flex;gap:5px;}
    .ab-slot{width:34px;height:34px;background:linear-gradient(180deg,rgba(20,20,34,0.9),rgba(8,8,16,0.9));border:1px solid var(--border);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:0.8rem;position:relative;}
    .ab-slot.ready{border-color:rgba(232,200,64,0.45);box-shadow:0 0 8px rgba(232,200,64,0.15),inset 0 1px 0 rgba(255,255,255,0.06);}
    .ab-cd{position:absolute;inset:0;border-radius:7px;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:0.5rem;color:var(--muted);}
    .ab-key{position:absolute;bottom:1px;right:4px;font-family:var(--font-title);font-size:0.4rem;color:var(--muted);}
    .hud-nivel{font-family:var(--font-title);font-size:0.56rem;letter-spacing:0.12em;color:var(--muted);}
    .hud-nivel b{color:var(--gold);font-weight:700;}

    /* Combo indicator */
    .combo-display{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:45;pointer-events:none;font-family:var(--font-title);font-size:0.7rem;letter-spacing:0.2em;color:var(--gold);opacity:0;transition:opacity 0.3s;}
    .combo-display.active{opacity:1;}

    /* Screens */
    .game-overlay{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
    .game-overlay.visible{display:flex;}

    #screen-pause{background:rgba(0,0,0,0.78);backdrop-filter:blur(6px);}
    .pause-title{font-family:var(--font-title);font-size:2.4rem;font-weight:900;letter-spacing:0.25em;color:#f4f4ff;margin-bottom:30px;text-shadow:0 0 40px rgba(255,255,255,0.08);}
    .pause-btn{font-family:var(--font-title);font-size:0.7rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--muted);padding:13px 0;cursor:pointer;transition:all 0.2s;min-width:260px;text-align:center;}
    .pause-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(232,200,64,0.04);}
    .pause-sep{width:260px;height:1px;background:var(--border);margin:6px 0;}
    .pause-stats{display:flex;gap:24px;margin-bottom:22px;font-family:var(--font-title);font-size:0.62rem;letter-spacing:0.12em;color:var(--muted);}
    .pstat{text-align:center;}
    .pstat-val{display:block;font-size:1.1rem;color:var(--gold);}

    #screen-death{background:rgba(0,0,0,0);transition:background 1.4s;}
    #screen-death.visible{background:rgba(50,0,0,0.85);}
    .death-title{font-family:var(--font-title);font-size:3.2rem;font-weight:900;letter-spacing:0.3em;color:var(--blood);text-shadow:0 0 60px rgba(192,48,48,0.5);margin-bottom:8px;animation:flicker 0.15s infinite;}
    @keyframes flicker{0%,100%{opacity:1}50%{opacity:0.85}}
    .death-sub{font-style:italic;font-size:1rem;color:var(--muted);margin-bottom:30px;}
    .death-stats{font-family:var(--font-title);font-size:0.62rem;color:var(--muted);letter-spacing:0.15em;margin-bottom:22px;}

    #screen-victory{background:rgba(0,18,0,0.82);}
    .victory-title{font-family:var(--font-title);font-size:2.8rem;font-weight:900;letter-spacing:0.2em;color:var(--gold);text-shadow:0 0 50px rgba(232,200,64,0.4);margin-bottom:8px;animation:glow 2s ease-in-out infinite;}
    @keyframes glow{0%,100%{text-shadow:0 0 30px rgba(232,200,64,0.4)}50%{text-shadow:0 0 60px rgba(232,200,64,0.7)}}
    .victory-sub{font-style:italic;font-size:1rem;color:var(--muted);margin-bottom:24px;}
    .victory-reward{display:flex;gap:18px;margin-bottom:26px;background:rgba(232,200,64,0.06);border:1px solid rgba(232,200,64,0.2);padding:14px 28px;}
    .vr-item{text-align:center;font-family:var(--font-title);font-size:0.65rem;}
    .vr-val{display:block;font-size:1.3rem;color:var(--gold);}

    #dialogue-box{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);z-index:80;width:min(600px,90vw);background:var(--panel);border:1px solid var(--border);border-top:2px solid var(--gold);padding:18px 24px;display:none;}
    #dialogue-box.visible{display:block;}
    .dlg-speaker{font-family:var(--font-title);font-size:0.6rem;letter-spacing:0.22em;color:var(--gold);margin-bottom:6px;}
    .dlg-text{font-size:0.95rem;color:var(--text-hi);line-height:1.7;}
    .dlg-hint{font-family:var(--font-title);font-size:0.5rem;letter-spacing:0.15em;color:var(--muted);text-align:right;margin-top:10px;}

    #cp-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:90;text-align:center;pointer-events:none;display:none;}
    #cp-banner.show{display:block;animation:cpAnim 2.5s ease forwards;}
    @keyframes cpAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(0.85)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
    .cp-icon{font-size:2.8rem;display:block;}
    .cp-title{font-family:var(--font-title);font-size:0.72rem;letter-spacing:0.3em;color:var(--gold);margin-top:8px;}

    .pickup-pop{position:fixed;z-index:85;pointer-events:none;font-family:var(--font-title);font-size:0.68rem;letter-spacing:0.1em;color:var(--gold);animation:popUp 1.3s ease forwards;text-shadow:0 0 8px rgba(232,200,64,0.5);}
    @keyframes popUp{0%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-50px) scale(0.8)}}

    #zone-banner{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:85;text-align:center;pointer-events:none;display:none;}
    #zone-banner.show{display:block;animation:zoneBanner 3.5s ease forwards;}
    @keyframes zoneBanner{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0}}
    .zb-line{font-family:var(--font-title);font-size:1.2rem;letter-spacing:0.3em;color:#f4f4ff;text-shadow:0 0 20px rgba(232,200,64,0.3);}
    .zb-sub{font-style:italic;font-size:0.88rem;color:var(--muted);margin-top:5px;}

    #boss-bar{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);width:min(520px,80vw);z-index:45;display:none;}
    #boss-bar.visible{display:block;animation:fadeIn 0.5s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}
    .boss-name{font-family:var(--font-title);font-size:0.65rem;letter-spacing:0.22em;color:var(--text-hi);text-align:center;margin-bottom:6px;}
    .boss-track{height:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border);overflow:hidden;position:relative;}
    .boss-fill{height:100%;background:linear-gradient(90deg,#901818,#d04040);transition:width 0.4s;position:relative;}
    .boss-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.15),transparent);}

    /* Screen transition */
    #screen-transition{position:fixed;inset:0;z-index:200;background:#000;opacity:0;pointer-events:none;transition:opacity 0.6s ease;}
    #screen-transition.active{opacity:1;}

    /* Viñeta + scanlines (capas de atmósfera) */
    #vignette{position:fixed;inset:0;z-index:35;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,0.5) 100%);}
    #scanlines{position:fixed;inset:0;z-index:36;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;}

    /* Pausa / muerte / victoria refinados */
    .pause-btn{border-radius:6px;letter-spacing:0.2em;}
    #screen-pause .pause-title{text-shadow:0 0 40px rgba(232,200,64,0.25);}
    #screen-victory .victory-reward{border-radius:10px;box-shadow:0 0 24px rgba(232,200,64,0.12) inset;}
    #boss-bar .boss-track{border-radius:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);}  </style>
</head>
<body>
  <div id="boot-splash" style="position:fixed;inset:0;z-index:999;background:#06060f;color:#e8c840;font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;font-size:18px;letter-spacing:8px;text-align:center;">PALOMA&nbsp;MIGAJERA</div>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div class="hud-hearts" id="hud-hearts"></div>
      <div class="hud-bar-row">
        <span class="hud-bar-lbl" style="display:inline-flex;align-items:center;">MP</span>
        <div class="hud-bar-track"><div class="hud-bar-fill mp-fill" id="hud-mp" style="width:100%"></div></div>
      </div>
      <div class="hud-bar-row">
        <span class="hud-bar-lbl" style="display:inline-flex;align-items:center;color:var(--gold);"><svg viewBox="0 0 16 16" width="12" height="12" fill="#e8c840"><polygon points="9,1 5,8 8,8 7,15 11,8 8,8"/></svg></span>
        <div class="hud-bar-track"><div class="hud-bar-fill energy-fill" id="hud-energy" style="width:100%"></div></div>
      </div>
    </div>
    <div class="hud-center">
      <div class="hud-zona" id="hud-zona">Ciudad Alta</div>
      <div class="hud-migajas" style="display:flex;align-items:center;justify-content:center;gap:5px;"><svg viewBox="0 0 16 16" width="13" height="13"><ellipse cx="8" cy="9" rx="7" ry="5" fill="#e8c840"/><ellipse cx="8" cy="8" rx="6" ry="4" fill="#f0d860"/><ellipse cx="7" cy="7" rx="2" ry="1.5" fill="#fff8a0" opacity="0.5"/></svg> <span id="hud-mig">0</span></div>
    </div>
    <div class="hud-right">
      <div class="hud-nivel">Nv.<b id="hud-nivel">1</b></div>
      <div class="hud-abilities">
        <div class="ab-slot" style="color:#e8e8ff;"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><rect x="7" y="1" width="2" height="8"/><rect x="4" y="8" width="8" height="2"/><rect x="7" y="10" width="2" height="5"/></svg><span class="ab-key">Z</span><div class="ab-cd" id="cd-z" style="display:none">–</div></div>
        <div class="ab-slot" style="color:#6ab0d8;"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="5" fill="#6ab0d8" opacity="0.6"/><circle cx="8" cy="8" r="3" fill="#c0e8ff"/><circle cx="8" cy="8" r="1.5" fill="#fff"/></svg><span class="ab-key">X</span><div class="ab-cd" id="cd-x" style="display:none">–</div></div>
        <div class="ab-slot" style="color:#c0c0e0;"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><path d="M2 8h10l-3-3 1-1 4 4-4 4-1-1 3-3H2z"/></svg><span class="ab-key">⇧</span><div class="ab-cd" id="cd-sh" style="display:none">–</div></div>
      </div>
    </div>
  </div>

  <div class="combo-display" id="combo-display"></div>

  <div id="boss-bar">
    <div class="boss-name" id="boss-name">CUERVO DE LA CHIMENEA</div>
    <div class="boss-track"><div class="boss-fill" id="boss-fill" style="width:100%"></div></div>
  </div>

  <div class="game-overlay" id="screen-pause">
    <div class="pause-title">— PAUSA —</div>
    <div class="pause-stats" id="pause-stats"></div>
    <button class="pause-btn" onclick="resumeGame()"><svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" style="vertical-align:middle;margin-right:8px;"><polygon points="4,2 14,8 4,14"/></svg>Continuar</button>
    <div class="pause-sep"></div>
    <button class="pause-btn" onclick="goTo('../habilidades/index.html')"><svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" style="vertical-align:middle;margin-right:8px;"><polygon points="8,1 10,6 16,6 11,10 13,15 8,12 3,15 5,10 0,6 6,6"/></svg>Habilidades</button>
    <button class="pause-btn" onclick="goTo('../inventario/index.html')"><svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" style="vertical-align:middle;margin-right:8px;"><rect x="3" y="5" width="10" height="9" rx="2" opacity="0.7"/><rect x="5" y="2" width="6" height="3" rx="1" opacity="0.4"/></svg>Inventario</button>
    <button class="pause-btn" onclick="goTo('../mapa/index.html')"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:middle;margin-right:8px;"><rect x="1" y="1" width="14" height="14" rx="1"/><line x1="5" y1="1" x2="5" y2="15"/><line x1="11" y1="1" x2="11" y2="15"/></svg>Mapa</button>
    <button class="pause-btn" onclick="goTo('../ajustes/index.html')"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.3" style="vertical-align:middle;margin-right:8px;"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.5 1.5M11.5 11.5L13 13M13 3l-1.5 1.5M4.5 11.5L3 13"/></svg>Ajustes</button>
    <div class="pause-sep"></div>
    <button class="pause-btn" id="btn-sfx" onclick="toggleSfxBtn()"><svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" style="vertical-align:middle;margin-right:8px;"><path d="M3 5h3l4-3v12l-4-3H3z"/><path d="M11 5.5s1.5 1 1.5 2.5-1.5 2.5-1.5 2.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>SFX: ON</button>
    <button class="pause-btn" id="btn-music" onclick="toggleMusicBtn()"><svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" style="vertical-align:middle;margin-right:8px;"><path d="M4 3v9M4 3l8-1v9M12 2v9"/><circle cx="4" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="10" r="2" fill="currentColor"/></svg>Música: ON</button>
    <div class="pause-sep"></div>
    <button class="pause-btn" onclick="saveAndExit()" style="color:var(--muted);font-size:0.6rem;"><svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" style="vertical-align:middle;margin-right:8px;"><path d="M2 2h9l3 3v9H2z" opacity="0.7"/><rect x="4" y="8" width="8" height="5" fill="#080810" opacity="0.4"/><rect x="5" y="9" width="3" height="2" rx="0.5"/></svg>Guardar y salir</button>
  </div>

  <div class="game-overlay" id="screen-death">
    <div class="death-title">HAS MUERTO</div>
    <div class="death-sub">Las migas siguen cayendo, sin ti.</div>
    <div class="death-stats" id="death-stats"></div>
    <button class="pause-btn" onclick="respawn()"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:middle;margin-right:8px;"><path d="M2 8a6 6 0 0111-3M14 8a6 6 0 01-11 3"/><polyline points="2,3 2,8 7,8"/><polyline points="14,13 14,8 9,8"/></svg>Revivir en checkpoint</button>
    <button class="pause-btn" onclick="saveAndExit()"><svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" style="vertical-align:middle;margin-right:8px;"><path d="M2 8l6-6 6 6v6H2z" opacity="0.7"/><rect x="6" y="10" width="4" height="4"/></svg>Volver al menú</button>
  </div>

  <div class="game-overlay" id="screen-victory">
    <div class="victory-title">¡VICTORIA!</div>
    <div class="victory-sub" id="victory-sub">Has derrotado al jefe.</div>
    <div class="victory-reward" id="victory-reward"></div>
    <button class="pause-btn" onclick="closeVictory()">Continuar →</button>
  </div>

  <div id="dialogue-box">
    <div class="dlg-speaker" id="dlg-speaker">???</div>
    <div class="dlg-text" id="dlg-text"></div>
    <div class="dlg-hint">[Z] Continuar</div>
  </div>

  <div id="cp-banner">
    <span class="cp-icon" style="color:#f0a020;"><svg viewBox="0 0 16 16" width="34" height="34"><path d="M8 1c-1 3-4 4-4 7a4 4 0 008 0c0-3-3-4-4-7z" fill="#f0a020"/><path d="M8 5c-.5 1.5-2 2-2 3.5a2 2 0 004 0c0-1.5-1.5-2-2-3.5z" fill="#ffe060"/></svg></span>
    <span class="cp-title">CHECKPOINT ACTIVADO</span>
  </div>

  <div id="zone-banner">
    <div class="zb-line" id="zb-name">Ciudad Alta</div>
    <div class="zb-sub" id="zb-sub">Zona 1 de 4</div>
  </div>

  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="screen-transition"></div>

  <script src="../shared/utils.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="../shared/sprites.js"></script>
  <script src="../Logros/sistema-logros.js"></script>
  <script src="map-engine.js"></script>
  <script src="entities.js"></script>
  <script src="physics.js"></script>
  <script src="renderer.js"></script>
  <script src="audio.js"></script>
  <script>
  const canvas = document.getElementById('game-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H;
  function resizeCanvas() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  let saveData = getSave();
  if (!saveData) { window.location.href = '../menu/index.html'; }

  const G = {
    state: 'loading',
    currentZone: saveData.zona || 'ciudad_alta',
    map: null,
    player: null,
    enemies: [],
    migajas: [],
    npcs: [],
    particles: [],
    projectiles: [],
    checkpoints: [],
    portals: [],
    camera: { x: 0, y: 0 },
    time: 0,
    bossFight: false,
    bossEnemy: null,
    activeNpc: null,
    loadProgress: 0,
  };

  window._gamePlayer = null;
  window._gameParticles = null;
  window.__SPRITES = SpriteSystem;
  SpriteSystem.build();
  SpriteSystem.load();

  const keys = {}, justP = {}, justR = {};
  window.addEventListener('keydown', e => {
    if (!keys[e.code]) justP[e.code] = true;
    keys[e.code] = true;
    if (e.code === 'Escape') togglePause();
    if (e.code === 'KeyZ') {
      if (G.state === 'dialogue') advanceDialogue();
    }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; justR[e.code] = true; });

  function getInput() {
    const cfg = getCfg().controles;
    return {
      izq: keys[cfg.izq] || keys['ArrowLeft'] || keys['KeyA'],
      der: keys[cfg.der] || keys['ArrowRight'] || keys['KeyD'],
      saltar: keys[cfg.saltar] || keys['Space'] || keys['KeyW'],
      dash: keys[cfg.dash] || keys['ShiftLeft'] || keys['ShiftRight'],
      ataque: keys[cfg.ataque] || keys['KeyZ'],
      especial: keys[cfg.especial] || keys['KeyX'],
      abajo: keys[cfg.abajo] || keys['ArrowDown'] || keys['KeyS'],
      justPressed: {
        saltar: justP[cfg.saltar] || justP['Space'] || justP['KeyW'],
        dash: justP[cfg.dash] || justP['ShiftLeft'] || justP['ShiftRight'],
        ataque: justP[cfg.ataque] || justP['KeyZ'],
        especial: justP[cfg.especial] || justP['KeyX'],
      },
    };
  }

  // =============================================
  //  CARGAR ZONA
  // =============================================
  function loadZone(zoneId) {
    G.state = 'loading';
    G.loadProgress = 0;
    G.enemies = [];
    G.migajas = [];
    G.npcs = [];
    G.particles = [];
    G.projectiles = [];
    G.bossFight = false;
    G.bossEnemy = null;
    document.getElementById('boss-bar').classList.remove('visible');

    setTimeout(() => {
      G.map = buildZone(zoneId);
      G.loadProgress = 50;
      const diff = DIFICULTAD[saveData.dificultad || 'normal'];

      if (!G.player) {
        G.player = createPlayer(saveData);
      }
      window._gamePlayer = G.player;
      window._gameParticles = G.particles;

      const cpData = (ZONE_CHECKPOINTS[zoneId] || []).find(c => c.lit) || { x: saveData.checkpoint?.x || 240 };
      G.player.x = cpData.x;
      G.player.y = 0;
      for (let ty = 0, guard = 0; ty < G.map.h && guard++ < 900; ty++) {
        if (isSolid(G.map.colData, G.player.x + G.player.w / 2, ty)) {
          G.player.y = ty - G.player.h - 2;
          break;
        }
      }
      if (G.player.y <= 0) G.player.y = G.map.h - 120;

      G.enemies     = spawnEnemies(zoneId, diff);
      G.migajas     = spawnWorldMigajas(zoneId);
      G.npcs        = spawnNPCs(zoneId);
      G.portals     = ZONE_PORTALS[zoneId] || [];
      G.checkpoints = (ZONE_CHECKPOINTS[zoneId] || []).map(cp => ({ ...cp, y: 0 }));

      G.checkpoints.forEach(cp => {
        for (let ty = 0, guard = 0; ty < G.map.h && guard++ < 900; ty++) {
          if (isSolid(G.map.colData, cp.x + 3, ty)) { cp.y = ty - 54; break; }
        }
      });
      G.npcs.forEach(npc => {
        for (let ty = 0, guard = 0; ty < G.map.h && guard++ < 900; ty++) {
          if (isSolid(G.map.colData, npc.x + npc.w / 2, ty)) { npc.y = ty - npc.h; break; }
        }
      });
      G.enemies.forEach(e => {
        for (let ty = 0, guard = 0; ty < G.map.h && guard++ < 900; ty++) {
          if (isSolid(G.map.colData, e.x + e.w / 2, ty)) { e.y = ty - e.h; break; }
        }
        if (e.isBoss) G.bossEnemy = e;
      });

      G.loadProgress = 100;
      G.currentZone = zoneId;
      G.state = 'running';
      PM_AUDIO.startMusic(zoneId);
      showZoneBanner(zoneId);
      updateHUD();
    }, 80);
  }

  // =============================================
  //  CÁMARA (con screen shake)
  // =============================================
  function updateCamera() {
    if (!G.map || !G.player) return;
    const targetX = G.player.x - W / 2 + G.player.w / 2;
    const targetY = G.player.y - H * 0.52;
    G.camera.x += (targetX - G.camera.x) * 0.09;
    G.camera.y += (targetY - G.camera.y) * 0.09;
    G.camera.x = Math.max(0, Math.min(G.camera.x, G.map.w - W));
    G.camera.y = Math.max(-150, Math.min(G.camera.y, G.map.h - H));

    updateScreenShake();
  }

  // =============================================
  //  UPDATE
  // =============================================
  function update(dt) {
    if (G.state !== 'running') return;
    const input = getInput();
    const p = G.player;

    const action = physicsPlayer(p, G.map.colData, dt, input);
    resolvePlayerMap(p, G.map.colData, G.map.w, G.map.h);
    updateCooldowns(p, dt);

    if (action) {
      if (action.action === 'jump') {
        spawnJumpFx(G.particles, p.x + p.w / 2, p.y + p.h, action.double, action.wallJump);
        PM_AUDIO.sfx[action.double ? 'doubleJump' : action.wallJump ? 'wallJump' : 'jump']();
        if (action.double) window._gifFx = { name: 'Doble Salto.gif', until: performance.now() + 320 };
      }
      if (action.action === 'dash') { spawnDashFx(G.particles, p.x + p.w / 2, p.y + p.h / 2, p.dashDir); PM_AUDIO.sfx.dash(); }
      if (action.action === 'attack') { doMeleeAttack(p, G.enemies, G.particles); PM_AUDIO.sfx.attack(); }
      if (action.action === 'palou') { firePalou(p, G.projectiles); PM_AUDIO.sfx.palou(); }
    }

    // Plumas en dash + planeo
    if (p.dashing && Math.random() > 0.35) {
      spawnFeatherFx(G.particles, p.x + p.w / 2, p.y + p.h / 2, p.dashDir || p.facing, 2);
    }

    // Wall slide particles
    if (p.wallSliding) {
      spawnWallSlideFx(G.particles, p.x + (p.facing > 0 ? p.w : 0), p.y + p.h / 2);
    }

    // Running dust
    if (p.onGround && Math.abs(p.vx) > 2 && Math.random() > 0.7) {
      spawnDustFx(G.particles, p.x + p.w / 2, p.y + p.h, p.facing);
    }

    physicsEnemies(G.enemies, G.map.colData, G.map.w, G.map.h, dt);

    for (const e of G.enemies) {
      if (!e.alive || !e._doAtk) continue;
      e._doAtk = false;
      if (hurtPlayer(p, e.dmg * (e.diff?.dmgEnemigo || 1), G.particles)) {
        updateHUD();
        PM_AUDIO.sfx.hurt();
        if (p.hp <= 0) killPlayer();
      }
    }

    updateProjectiles(G.projectiles, G.enemies, G.map.colData, dt, G.particles);

    const collected = collectMigajas(p, G.migajas);
    if (collected.length > 0) {
      collected.forEach((m, i) => {
        spawnPickupFx(G.particles, m.x, m.y, m.value);
        showPickupPopup(m.x - G.camera.x, m.y - G.camera.y, `+${m.value} migajas`);
        if (i === 0) PM_AUDIO.sfx[m.value >= 5 ? 'collectBig' : 'collect']();
      });
      updateHUD();
    }

    for (const cp of G.checkpoints) {
      if (!cp.lit) {
        const dx = Math.abs(p.x - cp.x);
        const dy = Math.abs(p.y - cp.y);
        if (dx < 24 && dy < 50) {
          cp.lit = true;
          saveData.checkpoint = { x: cp.x, y: cp.y };
          saveData.vida = p.hp;
          saveData.migajas = p.migajas;
          setSave(saveData);
          showCpBanner();
          PM_AUDIO.sfx.checkpoint();
        }
      }
    }

    for (const portal of G.portals) {
      if (rectsOverlap(p.x, p.y, p.w, p.h, portal.x, portal.y || 0, portal.w, portal.h || G.map.h)) {
        PM_AUDIO.sfx.portal();
        changeZone(portal.toZone);
        return;
      }
    }

    if (p.y > G.map.h + 80) killPlayer();

    if (G.bossEnemy && G.bossEnemy.alive) {
      updateBossBar();
    } else if (G.bossEnemy && !G.bossEnemy.alive && !G.bossFight) {
      G.bossFight = true;
      bossVictory();
    }

    if (input.justPressed.ataque && G.state === 'running') {
      checkNPCInteraction();
    }

    updateParticles(G.particles, dt);
    updateDamageNumbers(dt);

    // Combo display
    const comboEl = document.getElementById('combo-display');
    if (p.comboCount > 1 && p.comboTimer > 0) {
      comboEl.textContent = `${p.comboCount}x COMBO`;
      comboEl.classList.add('active');
    } else {
      comboEl.classList.remove('active');
    }

    G.time += dt;
    if (G.time % 5000 < dt + 16) {
      saveData.tiempoJugado += 5;
      if (getCfg().juego.autoGuardar) {
        saveData.migajas = p.migajas;
        saveData.vida = p.hp;
        setSave(saveData);
      }
    }
  }

  // =============================================
  //  RENDER
  // =============================================
  function render() {
    ctx.clearRect(0, 0, W, H);

    if (G.state === 'loading') {
      const bs = document.getElementById('boot-splash');
      if (bs) bs.style.display = 'none';
      const grd = ctx.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, '#06060f');
      grd.addColorStop(0.5, '#0b0b1a');
      grd.addColorStop(1, '#0d0d20');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);

      // Estrellas
      for (let i = 0; i < 60; i++) {
        const sx = (Math.sin(i * 127.1) * 0.5 + 0.5) * W;
        const sy = (Math.sin(i * 311.7) * 0.5 + 0.5) * H * 0.7;
        ctx.fillStyle = `rgba(255,255,255,${0.05 + (Math.sin(i * 7.3) * 0.5 + 0.5) * 0.2})`;
        ctx.fillRect(sx, sy, 2, 2);
      }

      // Título
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(232,200,64,0.7)';
      ctx.font = 'bold 30px Cinzel, serif';
      ctx.fillText('PALOMA MIGAJERA', W / 2, H / 2 - 150);
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillRect(W / 2 - 90, H / 2 - 140, 180, 1);

      // Paloma real: animación GIF de Franck si ya cargó, si no sprite procedural
      const t = performance.now() / 1000;
      const bounce = Math.sin(t * 3) * 6;
      const dg = window.__SPRITES && window.__SPRITES.getImg('Doble Salto.gif');
      if (dg) {
        drawSprite(ctx, dg, W / 2 - 28, H / 2 - 106 + bounce, 56, 56);
      } else {
        const wing = Math.floor(t * 9) % 3;
        const spr = sprite(wing === 0 ? 'pigeon_fly_r' : wing === 1 ? 'pigeon_fly2_r' : 'pigeon_glide_r') || sprite('pigeon_fly_r');
        if (spr) drawSprite(ctx, spr, W / 2 - 17, H / 2 - 92 + bounce, 34, 32);
      }

      // Sombra debajo de la paloma
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.ellipse(W / 2, H / 2 - 52, 26, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = 'rgba(232,200,64,0.85)';
      ctx.font = 'bold 12px Cinzel, serif';
      ctx.fillText('Cargando zona...', W / 2, H / 2 + 40);

      // Barra con degradado y brillo
      const barW = 260;
      const bx = W / 2 - barW / 2;
      const by = H / 2 + 52;
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(bx - 1, by - 1, barW + 2, 9);
      const p = Math.max(0.02, G.loadProgress / 100);
      const barGrad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
      barGrad.addColorStop(0, '#f0d860');
      barGrad.addColorStop(1, '#e0a820');
      ctx.fillStyle = barGrad;
      ctx.fillRect(bx, by, barW * p, 7);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(bx, by, barW * p, 2);
      ctx.fillStyle = 'rgba(176,176,208,0.65)';
      ctx.font = 'italic 12px "IM Fell English", serif';
      ctx.fillText('Z atacar · X palomaduken · ⇧ dash · ESC pausa', W / 2, H / 2 + 82);
      ctx.textAlign = 'left';
      return;
    }

    if (!G.map || !G.player) return;

    // Apply screen shake
    const cx = G.camera.x + screenShake.x;
    const cy = G.camera.y + screenShake.y;

    // Draw only the visible sub-rect of the map (big perf win)
    const sx = Math.max(0, Math.floor(cx)), sy = Math.max(0, Math.floor(cy));
    const sw = Math.min(MAP_W - sx, W + 1), sh = Math.min(MAP_H - sy, H + 1);
    if (sw > 0 && sh > 0) {
      ctx.drawImage(G.map.visual, sx, sy, sw, sh, sx - cx, sy - cy, sw, sh);
    }
    drawPortals(ctx, G.portals, cx, cy);
    drawCheckpoints(ctx, G.checkpoints, cx, cy);
    drawNPCs(ctx, G.npcs, cx, cy, G.player.x, G.player.y);
    drawMigajas(ctx, G.migajas, cx, cy);
    G.enemies.forEach(e => drawEnemy(ctx, e, cx, cy));
    drawProjectiles(ctx, G.projectiles, cx, cy);
    drawParticles(ctx, G.particles, cx, cy);
    drawPlayer(ctx, G.player, cx, cy);
    drawDamageNumberEntities(ctx, cx, cy);

    if (keys['F1']) {
      ctx.globalAlpha = 0.25;
      if (sw > 0 && sh > 0) ctx.drawImage(G.map.visual, sx, sy, sw, sh, sx - cx, sy - cy, sw, sh);
      ctx.globalAlpha = 1;
    }
  }

  // =============================================
  //  HUD
  // =============================================
  let _lastHpMax = 0, _lastHp = -1, _lastMp = -1, _lastEnergy = -1, _lastMig = -1, _lastZone = '';
  function updateHUD() {
    const p = G.player;
    if (!p) return;
    if (p.hpMax !== _lastHpMax || p.hp !== _lastHp) {
      _lastHpMax = p.hpMax; _lastHp = p.hp;
      const hh = document.getElementById('hud-hearts');
      hh.innerHTML = '';
      for (let i = 0; i < p.hpMax; i++) {
        const h = document.createElement('div');
        h.className = 'heart' + (i >= p.hp ? ' empty' : '');
        hh.appendChild(h);
      }
    }
    if (p.mp !== _lastMp) { _lastMp = p.mp; document.getElementById('hud-mp').style.width = (p.mp / p.mpMax * 100) + '%'; }
    if (p.energy !== _lastEnergy) { _lastEnergy = p.energy; document.getElementById('hud-energy').style.width = (p.energy / p.energyMax * 100) + '%'; }
    if (p.migajas !== _lastMig) { _lastMig = p.migajas; document.getElementById('hud-mig').textContent = p.migajas; }
    document.getElementById('hud-nivel').textContent = saveData.nivel;
    if (G.currentZone !== _lastZone) { _lastZone = G.currentZone; document.getElementById('hud-zona').textContent = G.currentZone.replace('_', ' ').toUpperCase(); }
    setCd('cd-z', p.atkTimer, ATK_DUR);
    setCd('cd-x', p.palouCooldown, PALOU_COOLDOWN);
    setCd('cd-sh', p.dashCooldown, DASH_COOLDOWN);
  }

  function setCd(id, val, max) {
    const el = document.getElementById(id);
    const slot = el ? el.parentElement : null;
    if (val > 0) {
      el.style.display = 'flex';
      el.textContent = (val / 1000).toFixed(1);
      if (slot) slot.classList.remove('ready');
    } else {
      el.style.display = 'none';
      if (slot) slot.classList.add('ready');
    }
  }

  function updateBossBar() {
    const b = G.bossEnemy;
    if (!b) return;
    document.getElementById('boss-bar').classList.add('visible');
    document.getElementById('boss-name').textContent = b.type.replace('_', ' ').toUpperCase();
    document.getElementById('boss-fill').style.width = Math.max(0, b.hp / b.maxHp * 100) + '%';
  }

  // =============================================
  //  PAUSA / ESTADOS
  // =============================================
  // =============================================
  //  AUDIO INTEGRATION
  // =============================================
  function toggleSfxBtn() {
    const on = PM_AUDIO.toggleSfx();
    document.getElementById('btn-sfx').textContent = 'SFX: ' + (on ? 'ON' : 'OFF');
  }
  function toggleMusicBtn() {
    const on = PM_AUDIO.toggleMusic();
    document.getElementById('btn-music').textContent = 'Música: ' + (on ? 'ON' : 'OFF');
  }
  function syncAudioBtns() {
    const bS = document.getElementById('btn-sfx');
    const bM = document.getElementById('btn-music');
    if (bS) bS.textContent = 'SFX: ' + (PM_AUDIO.sfxOn ? 'ON' : 'OFF');
    if (bM) bM.textContent = 'Música: ' + (PM_AUDIO.musicOn ? 'ON' : 'OFF');
  }
  // Init audio on first user gesture
  let _audioInited = false;
  function ensureAudio() {
    if (!_audioInited) { PM_AUDIO.init(); _audioInited = true; }
    PM_AUDIO.resume();
  }
  document.addEventListener('keydown', ensureAudio, { once: false });
  document.addEventListener('mousedown', ensureAudio, { once: false });
  document.addEventListener('touchstart', ensureAudio, { once: false });

  function togglePause() {
    if (G.state === 'dead' || G.state === 'victory' || G.state === 'loading') return;
    if (G.state === 'running' || G.state === 'dialogue') {
      G.activeNpc = null;
      document.getElementById('dialogue-box').classList.remove('visible');
      G.state = 'paused';
      document.getElementById('screen-pause').classList.add('visible');
      syncAudioBtns();
      document.getElementById('pause-stats').innerHTML = `
        <div class="pstat"><span class="pstat-val">${G.player.migajas}</span>Migajas</div>
        <div class="pstat"><span class="pstat-val">${saveData.muertes}</span>Muertes</div>
        <div class="pstat"><span class="pstat-val">${fmtTime(saveData.tiempoJugado)}</span>Jugado</div>
      `;
    } else if (G.state === 'paused') {
      resumeGame();
    }
  }

  function resumeGame() {
    G.state = 'running';
    document.getElementById('screen-pause').classList.remove('visible');
  }

  function killPlayer() {
    if (G.state === 'dead') return;
    G.state = 'dead';
    saveData.muertes++;
    setSave(saveData);
    addScreenShake(12);
    PM_AUDIO.sfx.death();
    document.getElementById('screen-death').classList.add('visible');
    document.getElementById('death-stats').textContent =
      `${saveData.muertes} muertes · ${G.player.migajas} migajas · ${fmtTime(saveData.tiempoJugado)} jugado`;
  }

  function respawn() {
    document.getElementById('screen-death').classList.remove('visible');
    const p = G.player;
    p.hp = p.hpMax;
    p.energy = p.energyMax;
    p.invincible = false;
    p.invTimer = 1200;
    p.vx = p.vy = 0;
    p.x = saveData.checkpoint?.x || 240;
    for (let ty = 0; ty < G.map.h; ty++) {
      if (isSolid(G.map.colData, p.x + p.w / 2, ty)) { p.y = ty - p.h - 2; break; }
    }
    G.state = 'running';
    updateHUD();
  }

  function saveAndExit() {
    saveData.migajas = G.player?.migajas || saveData.migajas;
    saveData.vida    = G.player?.hp      || saveData.vida;
    saveData.zona    = G.currentZone;
    setSave(saveData);
    goTo('../menu/index.html');
  }

  function bossVictory() {
    G.state = 'victory';
    const xpGain = G.bossEnemy.xp;
    const migGain = G.bossEnemy.migajas;
    G.player.migajas += migGain;
    addScreenShake(10);
    PM_AUDIO.sfx.victory();

    if (G.bossEnemy.type === 'jefe_cuervo') {
      G.player.habilidades.dobleSalto = true;
      G.player.maxJumps = 2;
      saveData.habilidades.dobleSalto = true;
    }
    if (G.bossEnemy.type === 'jefe_rata') {
      G.player.habilidades.dash = true;
      saveData.habilidades.dash = true;
    }

    const rewards = `
      <div class="vr-item"><span class="vr-val">+${xpGain}</span>XP</div>
      <div class="vr-item"><span class="vr-val">+${migGain}</span>Migajas</div>
      ${G.bossEnemy.type === 'jefe_cuervo' ? '<div class="vr-item"><span class="vr-val">' + '<svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" style="vertical-align:-4px;"><path d="M8 1l3 4H5zM8 6l3 4H5z"/></svg>' + '</span>Doble Salto</div>' : ''}
      ${G.bossEnemy.type === 'jefe_rata' ? '<div class="vr-item"><span class="vr-val">' + '<svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" style="vertical-align:-4px;"><path d="M2 8h10l-3-3 1-1 4 4-4 4-1-1 3-3H2z"/></svg>' + '</span>Dash</div>' : ''}
    `;
    document.getElementById('victory-reward').innerHTML = rewards;
    document.getElementById('victory-sub').textContent = `Has derrotado al ${G.bossEnemy.type.replace('_', ' ')}.`;
    document.getElementById('screen-victory').classList.add('visible');
    document.getElementById('boss-bar').classList.remove('visible');
  }

  function closeVictory() {
    document.getElementById('screen-victory').classList.remove('visible');
    G.state = 'running';
    updateHUD();
  }

  // =============================================
  //  NPCs
  // =============================================
  function checkNPCInteraction() {
    for (const npc of G.npcs) {
      const dx = Math.abs((G.player.x + G.player.w / 2) - (npc.x + npc.w / 2));
      const dy = Math.abs((G.player.y + G.player.h / 2) - (npc.y + npc.h / 2));
      if (dx < 50 && dy < 44) {
        G.activeNpc = npc;
        G.state = 'dialogue';
        document.getElementById('dlg-speaker').textContent = npc.name;
        document.getElementById('dlg-text').textContent = npc.dialogues[npc.dIdx];
        document.getElementById('dialogue-box').classList.add('visible');
        if (window.PALOMA_LOGROS) window.PALOMA_LOGROS.registrarNPCConocido(npc.name);
        return;
      }
    }
  }

  function advanceDialogue() {
    const npc = G.activeNpc;
    if (!npc) return;
    npc.dIdx = (npc.dIdx + 1) % npc.dialogues.length;
    if (npc.dIdx === 0) {
      document.getElementById('dialogue-box').classList.remove('visible');
      G.activeNpc = null;
      G.state = 'running';
    } else {
      document.getElementById('dlg-text').textContent = npc.dialogues[npc.dIdx];
    }
  }

  // =============================================
  //  CAMBIO DE ZONA
  // =============================================
  function changeZone(zoneId) {
    const trans = document.getElementById('screen-transition');
    trans.classList.add('active');
    setTimeout(() => {
      saveData.zona = zoneId;
      saveData.migajas = G.player.migajas;
      setSave(saveData);
      loadZone(zoneId);
      if (window.PALOMA_LOGROS) window.PALOMA_LOGROS.registrarAreaDescubierta(zoneId);
      setTimeout(() => trans.classList.remove('active'), 200);
    }, 600);
  }

  // =============================================
  //  BANNERS / POPUPS
  // =============================================
  function showZoneBanner(zoneId) {
    const names = {
      ciudad_alta: 'Ciudad Alta',
      alcantarillas: 'Alcantarillas de Migas',
      parque_palomas: 'Parque de las Palomas',
      torre_reloj: 'Torre del Reloj',
      bosque_encantado: 'Bosque Encantado',
      tejado_gansos: 'Tejado de los Gansos',
    };
    const subs = {
      ciudad_alta: 'Zona 1 de 6 — El tejado del mundo',
      alcantarillas: 'Zona 2 de 6 — Las profundidades envenenadas',
      parque_palomas: 'Zona 3 de 6 — El parque junto a la luna',
      torre_reloj: 'Zona 4 de 6 — Donde el tiempo se detiene',
      bosque_encantado: 'Zona 5 de 6 — Donde los árboles susurran',
      tejado_gansos: 'Zona 6 de 6 — El reino de los gansos',
    };
    document.getElementById('zb-name').textContent = names[zoneId] || zoneId;
    document.getElementById('zb-sub').textContent  = subs[zoneId] || '';
    const banner = document.getElementById('zone-banner');
    banner.classList.remove('show');
    void banner.offsetWidth;
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 3500);
  }

  function showCpBanner() {
    const b = document.getElementById('cp-banner');
    b.classList.remove('show');
    void b.offsetWidth;
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 2500);
  }

  function showPickupPopup(x, y, text) {
    const el = document.createElement('div');
    el.className = 'pickup-pop';
    el.style.left = (x - 16) + 'px';
    el.style.top  = (y - 16) + 'px';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }

  // =============================================
  //  GAME LOOP
  // =============================================
  let lastTime = 0;
  function loop(ts) {
    const dt = Math.min(ts - lastTime, 50);
    lastTime = ts;
    update(dt);
    updateCamera();
    render();
    for (const k in justP) delete justP[k];
    for (const k in justR) delete justR[k];
    requestAnimationFrame(loop);
  }

  // =============================================
  //  INICIO
  // =============================================
  document.addEventListener('DOMContentLoaded', () => {
    loadZone(saveData.zona || 'ciudad_alta');
    requestAnimationFrame(loop);
    setTimeout(() => {
      toast('Z atacar · X Palomaduken · ⇧ Dash · ESC pausa', 'info', 5000);
    }, 1200);
  });
  </script>
</body>
</html>
